<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification en deux étapes — Ezer Home</title>
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <script src="../../assets/js/theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = ezerTheme();</script>
</head>
<body class="bg-white lg:bg-ezer-green-light text-ezer-dark font-sans text-base leading-normal min-h-screen flex flex-col">

    <div data-layout="header"></div>

    <main class="flex-1">
        <div class="px-4 py-7 lg:px-8 lg:py-16 lg:pb-22">
            <div class="max-w-[520px] mx-auto lg:p-10 lg:border lg:border-ezer-green-border rounded-ezer bg-white flex flex-col gap-6">

                <span aria-hidden="true" class="w-16 h-16 rounded-full bg-ezer-green-light text-ezer-green inline-flex items-center justify-center">
                    <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"></path><path d="M9 12l2 2 4-4"></path></svg>
                </span>

                <div class="flex flex-col gap-2">
                    <h1 class="font-cooper font-normal text-3xl">Vérification en deux étapes</h1>
                    <p>Ouvrez votre application d'authentification et saisissez le code à 6 chiffres affiché pour Ezer Home.</p>
                </div>

                <form aria-label="Code de double authentification" class="flex flex-col gap-4" onsubmit="event.preventDefault()">
                    <div class="flex flex-col gap-2">
                        <label for="tfa" class="text-[15px] font-semibold">Code à 6 chiffres</label>
                        <input id="tfa" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="––––––" class="w-full h-[68px] px-4 text-center text-3xl font-semibold tracking-[0.5em] border border-ezer-borderMuted rounded-ezer bg-white focus:border-ezer-green focus:outline-none">
                        <span class="text-sm text-ezer-muted">Le code change toutes les 30 secondes.</span>
                    </div>
                    <label class="flex items-start gap-3 text-[15px] cursor-pointer">
                        <input type="checkbox" class="w-6 h-6 shrink-0 accent-ezer-green">
                        Ne plus me le demander sur cet appareil pendant 30 jours
                    </label>
                    <button type="submit" class="w-full min-h-[56px] rounded-ezer border-0 bg-ezer-green text-white text-[17px] font-semibold hover:bg-ezer-green-dark transition-colors">Valider</button>
                </form>

                <div class="flex flex-col pt-4 border-t border-ezer-green-borderLight">
                    <a href="2fa-secours.html" class="flex items-center min-h-[44px] font-semibold text-ezer-green hover:underline">Utiliser un code de secours</a>
                    <a href="../site/contact-particulier.html" class="flex items-center min-h-[44px] font-semibold text-ezer-green hover:underline">Je n'ai plus accès à mon application</a>
                </div>

            </div>
        </div>
    </main>

    <div data-layout="footer-mini"></div>

    <script src="../../assets/js/layout.js"></script>
    <script src="../../assets/js/main.js"></script>
</body>
</html>
