<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérifiez votre boîte e-mail — Ezer Home</title>
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <script src="../../assets/js/theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = ezerTheme();</script>
</head>
<body class="bg-white lg:bg-ezer-green-light text-ezer-dark font-sans text-base leading-normal min-h-screen flex flex-col">

    <div data-layout="header"></div>

    <main class="flex-1">
        <div class="px-4 py-7 lg:px-8 lg:py-16 lg:pb-22">
            <div class="max-w-[520px] mx-auto lg:p-10 lg:border lg:border-ezer-green-border rounded-ezer bg-white flex flex-col gap-6">

                <span aria-hidden="true" class="w-16 h-16 rounded-full bg-ezer-green-light text-ezer-green inline-flex items-center justify-center">
                    <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>
                </span>

                <div class="flex flex-col gap-2">
                    <h1 class="font-cooper font-normal text-3xl">Vérifiez votre boîte e-mail</h1>
                    <p>Nous avons envoyé un lien de connexion à <strong class="font-semibold">a•••••@exemple.tg</strong>. Ouvrez-le sur cet appareil pour vous connecter.</p>
                </div>

                <ul class="p-4 rounded-ezer bg-ezer-green-light flex flex-col gap-2 text-[15px] list-none">
                    <li>Le lien est valable 15 minutes et ne fonctionne qu'une fois.</li>
                    <li>Rien reçu ? Regardez dans les courriers indésirables.</li>
                </ul>

                <button type="button" class="w-full min-h-[56px] rounded-ezer border-2 border-ezer-green bg-white text-ezer-green text-[17px] font-semibold hover:bg-ezer-green-light transition-colors">Renvoyer le lien</button>

                <p class="text-center">
                    <a href="connexion.html" class="inline-flex items-center min-h-[44px] font-semibold text-ezer-green hover:underline">Utiliser une autre adresse</a>
                </p>

            </div>
        </div>
    </main>

    <div data-layout="footer-mini"></div>

    <script src="../../assets/js/layout.js"></script>
    <script src="../../assets/js/main.js"></script>
</body>
</html>
