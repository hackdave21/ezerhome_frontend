<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pages légales — Ezer Home</title>
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <script src="../../assets/js/theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = ezerTheme();</script>
</head>
<body class="bg-white text-ezer-dark font-sans text-base leading-relaxed">

    <div data-layout="header"></div>

    <main class="flex flex-col" id="lg-haut">

        <section class="bg-ezer-green-light">
            <div class="max-w-[1400px] mx-auto px-6 lg:px-12 py-8 lg:py-12 flex flex-col gap-3.5">
                <nav aria-label="Fil d'Ariane" class="text-sm">
                    <ol class="flex flex-wrap items-center gap-2 text-ezer-muted">
                        <li><a href="accueil.html" class="text-ezer-green hover:underline">Accueil</a></li>
                        <li aria-hidden="true">/</li>
                        <li><a href="#" id="fil-doc" class="text-ezer-green hover:underline">Mentions légales</a></li>
                    </ol>
                </nav>
                <h1 id="doc-titre" class="font-cooper font-normal text-3xl lg:text-5xl">Mentions légales</h1>
                <p class="text-sm text-ezer-muted">Dernière mise à jour : [date]</p>
                <nav aria-label="Documents" class="flex flex-wrap gap-2 pt-2">
                    <button type="button" data-doc="mentions" aria-pressed="true" class="min-h-[44px] px-4 rounded-ezer border-2 border-ezer-green bg-ezer-green text-white font-semibold text-[15px]">Mentions légales</button>
                    <button type="button" data-doc="confidentialite" aria-pressed="false" class="min-h-[44px] px-4 rounded-ezer border border-ezer-borderMuted bg-white text-ezer-dark font-semibold text-[15px]">Confidentialité</button>
                    <button type="button" data-doc="cgu" aria-pressed="false" class="min-h-[44px] px-4 rounded-ezer border border-ezer-borderMuted bg-white text-ezer-dark font-semibold text-[15px]">CGU</button>
                </nav>
            </div>
        </section>

        <div class="max-w-[1400px] mx-auto px-6 lg:px-12 py-8 lg:py-14 flex flex-col lg:flex-row items-start gap-8 lg:gap-16">

            <!-- SOMMAIRE -->
            <nav id="sommaire" aria-label="Sommaire" class="hidden lg:block w-[260px] shrink-0 lg:sticky lg:top-36 border-l-2 border-ezer-green pl-4">
                <p class="text-xs font-semibold uppercase tracking-wider text-ezer-muted mb-2">Sommaire</p>
                <ol id="sommaire-liste" class="flex flex-col"></ol>
            </nav>

            <details class="lg:hidden w-full border border-ezer-green-border rounded-ezer p-4">
                <summary class="cursor-pointer font-semibold">Sommaire</summary>
                <ol id="sommaire-liste-mobile" class="mt-3 pl-5 flex flex-col list-decimal"></ol>
            </details>

            <!-- ARTICLE -->
            <article class="flex-1 min-w-0 max-w-[720px] flex flex-col gap-10">
                <p id="doc-intro" class="text-[17px] leading-relaxed"></p>
                <div id="doc-sections" class="flex flex-col gap-10"></div>
                <div class="border-t border-ezer-green-borderLight pt-6 flex flex-wrap items-center justify-between gap-3">
                    <p>Une question ? <a href="contact-particulier.html" class="font-semibold text-ezer-green hover:underline">Contactez-nous</a></p>
                    <a href="#lg-haut" class="font-semibold text-ezer-green hover:underline">Retour en haut</a>
                </div>
            </article>
        </div>
    </main>

    <div data-layout="footer"></div>

    <script src="../../assets/js/layout.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
        (function () {
            var p = function (t) { return { t: t }; };

            var DOCS = {
                mentions: {
                    titre: 'Mentions légales',
                    intro: 'Cette page présente les informations légales relatives au site d\'Ezer Home.',
                    sections: [
                        { id: 'editeur', titre: 'Éditeur du site', paras: [
                            "Le site Ezer Home est édité par l'association Ezer Home, association à but non lucratif.",
                            "Siège : 138, Boulevard du 13 Janvier, Hanoukopé, Lomé, Togo. Téléphone : +228 98 13 57 57. E-mail : mail@ezerhome.org.",
                            "Numéro de récépissé et date de déclaration : à venir."
                        ]},
                        { id: 'publication', titre: 'Directeur de la publication', paras: [ "À venir." ] },
                        { id: 'hebergement', titre: 'Hébergement', paras: [ "À venir." ] },
                        { id: 'propriete', titre: 'Propriété intellectuelle', paras: [
                            'Le nom Ezer Home, son logo et l\'ensemble des contenus du site (textes, images, documents) appartiennent à l\'association, sauf mention contraire.',
                            'Toute reproduction, même partielle, sans autorisation écrite de l\'association est interdite.'
                        ]},
                        { id: 'credits', titre: 'Crédits', paras: [ "Conception et réalisation : à venir. Photographies : à venir." ] },
                        { id: 'ed-contact', titre: 'Contact', paras: [ "Pour toute question relative au site, écrivez-nous à mail@ezerhome.org." ] }
                    ]
                },
                confidentialite: {
                    titre: "Politique de confidentialité",
                    intro: "La confiance est au cœur de notre action. Cette page explique, simplement, quelles données nous collectons, pourquoi, et comment vous gardez la main sur elles.",
                    sections: [
                        { id: "responsable", titre: "Qui est responsable de vos données ?", paras: [
                            "Le responsable du traitement est l'association Ezer Home, dont le siège est situé 138, Boulevard du 13 Janvier, Hanoukopé, Lomé, Togo.",
                            "Pour toute question relative à vos données personnelles, écrivez-nous à mail@ezerhome.org ou appelez-nous au +228 98 13 57 57."
                        ]},
                        { id: "donnees", titre: "Quelles données collectons-nous ?", paras: [ "Nous ne demandons que les informations nécessaires au service que vous choisissez :" ], liste: [
                            "Écoute : nom complet, numéro de téléphone, et les informations que vous choisissez de partager.",
                            "Assistance : nom et prénoms, téléphone, adresse e-mail (facultative), type d'aide demandée et description de votre situation.",
                            "Formations et coaching : identité, coordonnées et données relatives à votre inscription.",
                            "Contact : les informations saisies dans le formulaire de contact."
                        ]},
                        { id: "bases", titre: "Sur quelle base traitons-nous vos données ?", paras: [ "Selon le cas, le traitement repose sur votre consentement (écoute, contact), sur l'exécution du service demandé (inscription), ou sur notre intérêt légitime à assurer le bon fonctionnement du site." ] },
                        { id: "finalites", titre: "Pourquoi ?", paras: [ "Uniquement pour traiter votre demande, assurer le service choisi, vous recontacter et, le cas échéant, gérer votre inscription. Vos données ne sont jamais utilisées à des fins commerciales ou publicitaires." ] },
                        { id: "acces", titre: "Qui y a accès ?", paras: [
                            "Seules les personnes de l'association chargées de votre demande : l'équipe d'écoute, le bureau ou les intervenants concernés, selon le cas.",
                            "Vos données ne sont ni vendues, ni louées, ni cédées à des tiers."
                        ]},
                        { id: "conservation", titre: "Combien de temps les gardons-nous ?", paras: [ "Les données sont conservées pendant la durée nécessaire au service, puis supprimées ou anonymisées :" ], liste: [
                            "Écoute : 12 mois après le dernier échange.",
                            "Assistance : 24 mois après la clôture de la demande.",
                            "Formations et coaching : 3 ans après la fin de la session.",
                            "Contact : 12 mois après la réception du message.",
                            "Compte personnel : jusqu'à sa suppression, puis 30 jours dans nos sauvegardes."
                        ]},
                        { id: "securite", titre: "Comment les protégeons-nous ?", paras: [
                            "L'accès aux données est protégé par mot de passe et réservé aux seules personnes habilitées. Les échanges avec le site sont chiffrés (HTTPS) et des sauvegardes régulières sont réalisées.",
                            "Vos données sont hébergées sur des serveurs sécurisés et ne font l'objet d'aucun transfert à des fins commerciales."
                        ]},
                        { id: "droits", titre: "Vos droits", paras: [
                            "Vous pouvez à tout moment demander à consulter, corriger ou supprimer vos données, en limiter le traitement ou retirer votre consentement, en écrivant à mail@ezerhome.org ou en appelant le +228 98 13 57 57.",
                            "Depuis votre espace personnel, vous pouvez également demander l'export de vos données ou la suppression de votre compte.",
                            "Ces droits s'exercent conformément à la loi n° 2019-014 du 29 octobre 2019 relative à la protection des données à caractère personnel au Togo. Si vous estimez que vos droits ne sont pas respectés, vous pouvez adresser une réclamation à l'Instance de Protection des Données à Caractère Personnel (IPDCP)."
                        ]},
                        { id: "cookies", titre: "Cookies", paras: [
                            "Le site n'utilise que les cookies strictement nécessaires à son fonctionnement (session, sécurité, mémorisation de votre choix de consentement). Aucun cookie de mesure d'audience ou de publicité n'est posé.",
                            "Vous pouvez à tout moment supprimer ou bloquer ces cookies dans les réglages de votre navigateur ; certaines fonctionnalités, comme la connexion, pourraient alors ne plus fonctionner."
                        ]},
                        { id: "modifications", titre: "Modification de cette politique", paras: [ "Cette politique peut être mise à jour pour tenir compte des évolutions du site ou de la réglementation. La date de dernière mise à jour figure en haut de la page." ] }
                    ]
                },
                cgu: {
                    titre: "Conditions générales d'utilisation",
                    intro: "Ces conditions encadrent l'utilisation du site Ezer Home et de ses services. En utilisant le site, vous les acceptez.",
                    sections: [
                        { id: "objet", titre: "Objet", paras: [ "Les présentes conditions générales d'utilisation ont pour objet d'encadrer l'accès au site Ezer Home et l'utilisation des services qu'il propose : écoute, assistance, formations, coaching et contact." ] },
                        { id: "acces-site", titre: "Accès au site", paras: [
                            "Le site est accessible gratuitement, sous réserve d'une connexion à Internet. L'association s'efforce d'en assurer la disponibilité, sans pouvoir la garantir en permanence.",
                            "L'accès peut être suspendu temporairement pour maintenance, mise à jour ou en cas de force majeure."
                        ]},
                        { id: "compte", titre: "Compte personnel", paras: [
                            "Un compte est nécessaire pour l'écoute, les formations et le coaching. Vous vous engagez à fournir des informations exactes et à jour.",
                            "Vous êtes responsable de la confidentialité de votre mot de passe : toute activité effectuée depuis votre compte vous est imputable. Prévenez-nous sans délai en cas d'utilisation non autorisée."
                        ]},
                        { id: "services", titre: "Services proposés", paras: [ "Les services proposés sur le site sont les suivants :" ], liste: [
                            "Écoute et accompagnement : gratuit.",
                            "Assistance matérielle : gratuite.",
                            "Formations et coaching : selon les offres publiées sur le site."
                        ]},
                        { id: "inscriptions", titre: "Inscriptions", paras: [
                            "Les inscriptions aux formations et au coaching sont confirmées par le bureau.",
                            "Vous pouvez annuler une inscription en nous contactant à mail@ezerhome.org."
                        ]},
                        { id: "charte", titre: "Charte d'écoute", paras: [ "L'accès au service d'écoute suppose l'acceptation et la signature de la charte d'écoute. Celle-ci précise les engagements réciproques, la confidentialité des échanges et les limites du service." ] },
                        { id: "comportement", titre: "Utilisation loyale", paras: [ "Vous vous engagez à utiliser le site de manière loyale, à ne pas perturber son fonctionnement, à ne pas usurper l'identité d'un tiers et à respecter la confidentialité des personnes accompagnées." ] },
                        { id: "responsabilite", titre: "Responsabilité", paras: [
                            "L'écoute et le coaching ne remplacent ni un avis médical, ni un traitement, ni un service d'urgence. En cas d'urgence vitale, contactez immédiatement les secours compétents.",
                            "L'association met tout en œuvre pour fournir des informations fiables mais ne peut être tenue responsable de l'usage fait des contenus du site."
                        ]},
                        { id: "propriete", titre: "Propriété intellectuelle", paras: [ "Le nom Ezer Home, son logo et l'ensemble des contenus du site appartiennent à l'association, sauf mention contraire. Toute reproduction sans autorisation écrite est interdite." ] },
                        { id: "donnees", titre: "Données personnelles", paras: [ "Le traitement de vos données personnelles est décrit dans la Politique de confidentialité, accessible à tout moment depuis le site." ] },
                        { id: "droit", titre: "Droit applicable", paras: [
                            "Les présentes conditions sont soumises au droit togolais. En cas de litige, une solution amiable sera recherchée avant toute action devant les juridictions compétentes de Lomé.",
                            "Ces conditions peuvent évoluer ; la date de dernière mise à jour figure en haut de page."
                        ]}
                    ]
                }
            };

            var CHECK = '<svg aria-hidden="true" class="shrink-0 mt-1 w-[18px] h-[18px] text-ezer-green" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>';

            function rendre(id) {
                var doc = DOCS[id];
                document.getElementById('doc-titre').textContent = doc.titre;
                document.getElementById('fil-doc').textContent = doc.titre;
                document.getElementById('doc-intro').textContent = doc.intro;

                var sections = document.getElementById('doc-sections');
                var sommaire = document.getElementById('sommaire-liste');
                var sommaireMobile = document.getElementById('sommaire-liste-mobile');
                sections.innerHTML = '';
                sommaire.innerHTML = '';
                sommaireMobile.innerHTML = '';

                doc.sections.forEach(function (sec, i) {
                    var art = document.createElement('section');
                    art.className = 'flex flex-col gap-3.5 scroll-mt-36';
                    art.setAttribute('aria-labelledby', sec.id + '-t');

                    var h = document.createElement('h2');
                    h.id = sec.id + '-t';
                    h.className = 'font-cooper font-normal text-2xl lg:text-[26px]';
                    h.innerHTML = '<span class="text-ezer-green">' + (i + 1) + '.</span> ' + sec.titre;
                    art.appendChild(h);

                    (sec.paras || []).forEach(function (t) {
                        var el = document.createElement('p');
                        el.textContent = t;
                        art.appendChild(el);
                    });

                    if (sec.liste) {
                        var ul = document.createElement('ul');
                        ul.className = 'flex flex-col gap-2 list-none';
                        sec.liste.forEach(function (t) {
                            var li = document.createElement('li');
                            li.className = 'flex items-start gap-2.5';
                            li.innerHTML = CHECK + '<span>' + t + '</span>';
                            ul.appendChild(li);
                        });
                        art.appendChild(ul);
                    }

                    sections.appendChild(art);

                    ['sommaire-liste', 'sommaire-liste-mobile'].forEach(function (sid) {
                        var li = document.createElement('li');
                        var a = document.createElement('a');
                        a.href = '#' + sec.id;
                        a.className = 'block py-1.5 hover:text-ezer-green hover:underline';
                        a.textContent = (i + 1) + '. ' + sec.titre;
                        li.appendChild(a);
                        document.getElementById(sid).appendChild(li);
                    });
                });

                document.querySelectorAll('[data-doc]').forEach(function (b) {
                    var on = b.getAttribute('data-doc') === id;
                    b.setAttribute('aria-pressed', on ? 'true' : 'false');
                    b.classList.toggle('bg-ezer-green', on);
                    b.classList.toggle('text-white', on);
                    b.classList.toggle('border-ezer-green', on);
                    b.classList.toggle('border-2', on);
                    b.classList.toggle('bg-white', !on);
                    b.classList.toggle('text-ezer-dark', !on);
                    b.classList.toggle('border-ezer-borderMuted', !on);
                });

                if (location.hash && DOCS[id].sections.some(function (s) { return '#' + s.id === location.hash; })) {
                    var cible = document.querySelector(location.hash);
                    if (cible) cible.scrollIntoView();
                }
            }

            document.querySelectorAll('[data-doc]').forEach(function (b) {
                b.addEventListener('click', function () { rendre(b.getAttribute('data-doc')); });
            });

            var initial = location.hash.replace('#', '');
            rendre(initial === 'confidentialite' || initial === 'cgu' ? initial : 'mentions');
        })();
    </script>
</body>
</html>
